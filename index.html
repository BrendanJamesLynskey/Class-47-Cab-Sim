<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 47 Cab Simulator</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* ---- The little display at the top (hud.js) ---- */
  .hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 600 2.4vh system-ui, sans-serif;
         text-shadow: 0 0 4px #000, 0 1px 3px #000; }
  .hud > div { position: absolute; }
  .hud-speed { top: 1.5vh; left: 2vw; }
  .hud-speed-number { font-size: 6vh; font-weight: 800; }
  .hud-unit { opacity: 0.85; }
  .hud-limit { top: 1.5vh; left: 50%; transform: translateX(-50%); width: 6.4vh; height: 6.4vh; box-sizing: border-box;
               border: 0.7vh solid #d9231f; border-radius: 50%; background: #fff; color: #111; text-shadow: none;
               font-size: 3.2vh; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .hud-limit.flash { animation: flash 0.5s steps(2) infinite; }
  @keyframes flash { 50% { background: #d9231f; color: #fff; } }
  .hud-levers { top: 1.5vh; right: 2vw; width: 26vh; }
  .hud-row { display: flex; align-items: center; gap: 1vh; margin-bottom: 0.6vh; }
  .hud-label { width: 8vh; font-size: 2vh; opacity: 0.9; }
  .hud-bar { flex: 1; height: 1.8vh; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.5); }
  .hud-fill { display: block; height: 100%; }
  .hud-fill-power { background: #4fc26a; }
  .hud-fill-brake { background: #e4553c; }
  .hud-percent { width: 6vh; text-align: right; font-size: 2vh; }
  .hud-reverser { top: 9.5vh; left: 2vw; font-size: 2vh; }
  .hud-reverser.warn { color: #ffd54a; }
  .hud-progress { top: 9.5vh; left: 50%; transform: translateX(-50%); font-size: 2vh; opacity: 0.9; white-space: nowrap; }
  .hud-hint { top: 15vh; left: 50%; transform: translateX(-50%); font-size: 2.8vh; color: #ffe27a; white-space: nowrap; }
  .hud-status { top: 19vh; left: 50%; transform: translateX(-50%); font-size: 2.4vh; color: #ff8a70; white-space: nowrap; }

  /* ---- Big message screens: start, paused, end of line ---- */
  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8, 14, 24, 0.62);
             color: #fff; font-family: system-ui, sans-serif; text-align: center; }
  .overlay-card { max-width: 70vw; padding: 3vh 4vw; }
  .overlay h1 { font-size: 6vh; margin: 0 0 2vh; text-shadow: 0 2px 6px #000; }
  .overlay p { font-size: 2.8vh; margin: 1.2vh 0; }
  .overlay .pad { color: #9be7ff; }
  .overlay .pad.bad { color: #ffd54a; }
  .overlay .prompt { font-size: 4vh; font-weight: 800; margin-top: 3vh; color: #ffe27a; }

  /* ---- Performance readout (press F1) ---- */
  .debug { position: fixed; left: 1vw; bottom: 1vh; margin: 0; padding: 1vh 1.2vw; background: rgba(0,0,0,0.65); color: #9dff9d;
           font: 2vh ui-monospace, monospace; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="src/main.js" type="module"></script>
</body>
</html>
